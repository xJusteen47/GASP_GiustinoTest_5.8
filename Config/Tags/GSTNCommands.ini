; Designer input tags of this project: buttons, commands and their lock tags that are game data, not plugin vocabulary
; (docs/architecture/input.md section 3.1). The plugins declare their roots and the standard combat set natively; leaves like
; these are added here so they need no code. Tags in a Config/Tags file are picked up by the Gameplay Tags editor and the build.
;
; Test content of the PIE harness (Tools/GAS/setup_gas_assets.py --combat-input): a dash and a buff that are plain presses.

