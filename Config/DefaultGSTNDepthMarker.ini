; Project side of the depth marker: names the prototype toy look (content in /Game, made by Tools/DepthMarker/setup_depth_marker_toy_look.py).
; The classic look stays the default. Try the toy look in PIE with the console command: gstn.DepthMarker.Style toy  (classic to go back).
; To make it the default, set DefaultLook=Toy.

[/Script/GSTNDepthMarkerRuntime.GSTN_DepthMarkerSettings]
ToyStyle=/Game/Blueprints/DepthMarker/DMS_Toy.DMS_Toy
DefaultLook=Classic
; Crystal preview (console: gstn.DepthMarker.CrystalPreview 1 naked crystal, 2 plain shell with the crack glow layer, 0 off).
; The generated materials read the character glow from custom primitive data 16 (LightThrough) and 17..20 (player colour): CharacterCPDIndexLight / CharacterCPDIndexColor.
CrystalPreviewMaterial=/Game/Blueprints/DepthMarker/M_DM_CrystalCharacter.M_DM_CrystalCharacter
CrackShellPreviewMaterial=/Game/Blueprints/DepthMarker/M_DM_CrackShell.M_DM_CrackShell
