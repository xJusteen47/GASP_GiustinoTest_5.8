; Project overrides of the GSTN Combat plugin settings (the plugin's own defaults are in Plugins/GSTNCombat/Config/DefaultGSTNCombat.ini).

[/Script/GSTNCombatCore.GSTN_CombatSettings]
; Speed the movement modes are authored for: a combatant whose WalkSpeed stat equals it moves at the authored speeds
StatsReferenceWalkSpeed=600.0
; The GASP walking mode (BP_MovementMode_Walking) takes its speed from these gait variables, which feed MaxSpeedOverride and so win
; over UCommonLegacyMovementSettings::MaxSpeed. The stats movement modifier assigns each its archetype value * the stat factor
+StatsSpeedProperties=WalkSpeed
+StatsSpeedProperties=RunSpeed
+StatsSpeedProperties=SprintSpeed
+StatsSpeedProperties=CrouchSpeed
