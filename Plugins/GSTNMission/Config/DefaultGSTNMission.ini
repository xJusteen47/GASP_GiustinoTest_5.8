; GSTNMission defaults (M12 G4). The missions of a level are in its GameRules asset (piece "Missions"); these are the values without one.
[/Script/GSTNMissionCore.GSTN_MissionRules]
bEnabled=False
bMergeSameFrameEvents=True
PollHz=4
; The respawn framework's level restart resets the missions (a tag only: this plugin does not depend on GSTNRespawn)
ResetOnEvents=(GameplayTags=((TagName="Message.Respawn.RestartLevel")))
; Who is down for "all alive players" (tags only: no dependency on combat or respawn)
DownEvents=(GameplayTags=((TagName="Combat.Event.KO")))
UpEvents=(GameplayTags=((TagName="Message.Respawn.Respawned")))
