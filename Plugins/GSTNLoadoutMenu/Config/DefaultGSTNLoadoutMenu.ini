[/Script/GSTNLoadoutMenu.GSTN_LoadoutMenuRules]
; The loadout screen opens by itself when a player first spawns in these levels (the playtest hub). The harness levels are not listed:
; a mode or level that wants it uses its GameRules asset's "Loadout screen" piece. -GSTNNoLoadoutMenu on the command line keeps it shut.
bAutoOpenEverywhere=False
+AutoOpenLevels=/Game/Levels/Test/L_Test_Hub.L_Test_Hub
LastLoadoutPreset=Last
