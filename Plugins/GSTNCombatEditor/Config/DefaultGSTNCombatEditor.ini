; Defaults of the GSTN Combat Editor plugin. A project overrides any of them in its own Config/DefaultGSTNCombatEditor.ini
; (or through Project Settings > Plugins > GSTN Combat Editor). Lists are added to with +, replaced with !Name=ClearArray first.

[/Script/GSTNCombatEditor.GSTN_CombatEditorSettings]
; Baking is an explicit button; a stale bake is a validation error, not an automatic action
bBakeOnSave=False
bAutoKeyDefault=True
; Used only when the Network Prediction settings object cannot be read; the project's own fixed tick rate wins
FallbackTickRateHz=62.5
DebuggerKey=NumPadFive
GenericTrackColor=(R=0.450000,G=0.450000,B=0.450000,A=1.000000)

; Track row colours by track struct name (the F prefix left out)
+TrackColors=(TrackStruct="GSTN_TimelineTrack_CancelWindow",Color=(R=0.200000,G=0.600000,B=0.900000,A=1.000000))
+TrackColors=(TrackStruct="GSTN_TimelineTrack_Movement",Color=(R=0.300000,G=0.750000,B=0.350000,A=1.000000))
+TrackColors=(TrackStruct="GSTN_TimelineTrack_Tags",Color=(R=0.800000,G=0.650000,B=0.200000,A=1.000000))
+TrackColors=(TrackStruct="GSTN_TimelineTrack_Event",Color=(R=0.700000,G=0.400000,B=0.850000,A=1.000000))
+TrackColors=(TrackStruct="GSTN_TimelineTrack_WeaponSwitch",Color=(R=0.900000,G=0.500000,B=0.200000,A=1.000000))
+TrackColors=(TrackStruct="GSTN_TimelineTrack_Hitbox",Color=(R=0.900000,G=0.250000,B=0.250000,A=1.000000))
+TrackColors=(TrackStruct="GSTN_TimelineTrack_HurtboxModifier",Color=(R=0.250000,G=0.800000,B=0.800000,A=1.000000))

; Bone-name fragments that mirror each other
+MirrorNamePairs=(Left="_l",Right="_r",bCaseSensitive=False)
+MirrorNamePairs=(Left="Left",Right="Right",bCaseSensitive=True)
+MirrorNamePairs=(Left=".L",Right=".R",bCaseSensitive=True)
MirrorForwardAxis=PositiveX

; Physics Asset bone name to hurtbox zone tag, first match wins: the specific extremities before the limbs that contain them
+HurtboxZoneRules=(BoneNameContains="head",Zone=(TagName="Combat.Hurtbox.Head"))
+HurtboxZoneRules=(BoneNameContains="neck",Zone=(TagName="Combat.Hurtbox.Head"))
+HurtboxZoneRules=(BoneNameContains="hand",Zone=(TagName="Combat.Hurtbox.Hand"))
+HurtboxZoneRules=(BoneNameContains="foot",Zone=(TagName="Combat.Hurtbox.Foot"))
+HurtboxZoneRules=(BoneNameContains="ball",Zone=(TagName="Combat.Hurtbox.Foot"))
+HurtboxZoneRules=(BoneNameContains="arm",Zone=(TagName="Combat.Hurtbox.Arm"))
+HurtboxZoneRules=(BoneNameContains="clavicle",Zone=(TagName="Combat.Hurtbox.Arm"))
+HurtboxZoneRules=(BoneNameContains="thigh",Zone=(TagName="Combat.Hurtbox.Leg"))
+HurtboxZoneRules=(BoneNameContains="calf",Zone=(TagName="Combat.Hurtbox.Leg"))
+HurtboxZoneRules=(BoneNameContains="leg",Zone=(TagName="Combat.Hurtbox.Leg"))
+HurtboxZoneRules=(BoneNameContains="spine",Zone=(TagName="Combat.Hurtbox.Torso"))
+HurtboxZoneRules=(BoneNameContains="pelvis",Zone=(TagName="Combat.Hurtbox.Torso"))
