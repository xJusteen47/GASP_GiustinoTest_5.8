; Designer input tags of the GSTN Piggyback plugin (combat-m7-piggyback.md 7 and 11): the three meanings of the interact button that a
; mount adds. Ini only, as every designer-made command tag (input.md 3.1): the native tags (Combat.Link.Type.Mount, Interact.Target.Mount...)
; are declared in GSTN_PiggybackTags.h. The plugin registers this folder with the tag manager at startup, so with the plugin disabled
; none of these tags exists and a binding that names one is simply unbound (legal, input.md 8.2).

