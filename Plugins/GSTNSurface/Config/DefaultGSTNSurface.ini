; Defaults of the GSTN Surface plugin. A project overrides any of them in its own Config/DefaultGSTNSurface.ini
; (or through Project Settings > Plugins > GSTN Surface).

[/Script/GSTNSurfaceCore.GSTN_SurfaceSettings]
; What an unmarked surface offers: everything the wall modes and the walking mode did before the plugin, so enabling it
; changes nothing until a designer marks a surface (traversal-surfaces.md 2.2 step 4)
Default=(Behaviours=(GameplayTags=((TagName="Surface.Behaviour.WallSlide"),(TagName="Surface.Behaviour.WallClimb"),(TagName="Surface.Behaviour.Stand"))),SurfaceType=(TagName="Surface.Type.Wall"))

; The physical materials of the L_Test_Combat map (Tools/GAS/build_test_combat_map.py), by soft path: they are test content of the project, so a project
; without them keeps the empty lookup and nothing here loads. A game replaces this map in its own Config/DefaultGSTNSurface.ini
PhysicalMaterials=(("/Game/GASNPPTest/Combat/PM_Test_Wall.PM_Test_Wall", (Behaviours=(GameplayTags=((TagName="Surface.Behaviour.WallSlide"),(TagName="Surface.Behaviour.WallClimb"),(TagName="Surface.Behaviour.Stand"))),SurfaceType=(TagName="Surface.Type.Wall"))),("/Game/GASNPPTest/Combat/PM_Test_Glass.PM_Test_Glass", (Behaviours=(GameplayTags=((TagName="Surface.Behaviour.Stand"))),SurfaceType=(TagName="Surface.Type.Glass"))))
