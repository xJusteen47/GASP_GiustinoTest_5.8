; Defaults of the GSTN Surface plugin. A project overrides any of them in its own Config/DefaultGSTNSurface.ini
; (or through Project Settings > Plugins > GSTN Surface).

[/Script/GSTNSurfaceCore.GSTN_SurfaceSettings]
; What an unmarked surface offers: everything the wall modes and the walking mode did before the plugin, so enabling it
; changes nothing until a designer marks a surface (traversal-surfaces.md 2.2 step 4)
Default=(Behaviours=(GameplayTags=((TagName="Surface.Behaviour.WallSlide"),(TagName="Surface.Behaviour.WallClimb"),(TagName="Surface.Behaviour.Stand"))),SurfaceType=(TagName="Surface.Type.Wall"))
