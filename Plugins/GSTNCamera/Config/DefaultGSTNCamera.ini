; Defaults of the GSTN Camera plugin. A project overrides any of them in its own Config/DefaultGSTNCamera.ini
; (or through Project Settings > Plugins > GSTN Camera). The plugin ships no content: the look action, the recenter action and the
; mapping context are soft references a project sets, empty means no plugin look input (use UGSTN_CameraComponent::AddLookInput).

[/Script/GSTNCameraRuntime.GSTN_CameraSettings]
bEnabled=True
LookDegreesPerUnit=0.5
FadeTag=GSTN.CameraFade
FadeCustomDataIndex=0
