; Defaults of the GSTN Depth Marker plugin. A project overrides any of them in its own Config/DefaultGSTNDepthMarker.ini
; (or through Project Settings > Plugins > GSTN Depth Marker). The built-in look is made of two ENGINE assets, kept as soft
; references here (never in code): clear them and the built-in presenters draw nothing until a style names its own content.

[/Script/GSTNDepthMarkerRuntime.GSTN_DepthMarkerSettings]
DefaultSegmentMesh=/Engine/BasicShapes/Cube.Cube
DefaultSegmentMaterial=/Engine/EngineDebugMaterials/DebugMeshMaterial.DebugMeshMaterial
TintParameterName=Color
OpacityParameterName=Opacity
