; Defaults of the GSTN Combat plugin. A project overrides any of them in its own Config/DefaultGSTNCombat.ini
; (or through Project Settings > Plugins > GSTN Combat). The plugin contributes these to the GSTN Input settings at startup.

[/Script/GSTNCombatCore.GSTN_CombatSettings]
; Priority tier per command root: a higher tier always beats a lower one (combat.md 8.2)
CommandTiers=(((TagName="Command.Attack"),100),((TagName="Command.Strong"),200),((TagName="Command.Special"),300),((TagName="Command.Combo"),350),((TagName="Command.Super"),400))
; Buttons whose presses compete for one move
+ExclusiveButtons=(TagName="Input.Button.Attack")
+ExclusiveButtons=(TagName="Input.Button.Strong")
+ExclusiveButtons=(TagName="Input.Button.Special")
