; Defaults of the GSTN Combat plugin. A project overrides any of them in its own Config/DefaultGSTNCombat.ini
; (or through Project Settings > Plugins > GSTN Combat). The plugin contributes these to the GSTN Input settings at startup.

[/Script/GSTNCombatCore.GSTN_CombatSettings]
; Priority tier per command root: a higher tier always beats a lower one (combat.md 8.2)
CommandTiers=(((TagName="Command.Attack"),100),((TagName="Command.Strong"),200),((TagName="Command.Special"),300),((TagName="Command.Combo"),350),((TagName="Command.Super"),400))
; Buttons whose presses compete for one move
+ExclusiveButtons=(TagName="Input.Button.Attack")
+ExclusiveButtons=(TagName="Input.Button.Strong")
+ExclusiveButtons=(TagName="Input.Button.Special")
; Frames of the startup override window of a timeline that takes the default of its command tier (combat.md 8.3): attack 1, strong 2, special 2
OverrideFramesByTier=((100,1),(200,2),(300,2))
; Jump (combat.md 11b): what a launch by something else (a trampoline) does to the jump state, and the coyote window after a ledge
JumpResetRules=(AirJumpsOnExternalLaunch=Refill,AirJumpsSetCount=1,CoyoteOnExternalLaunch=Clear,bCancelHoldPhaseOnExternalLaunch=True)
JumpCoyoteFrames=4
JumpSquatFrames=0
; Interact (default movement slots): a press of at least this many frames is a hold (pick up), a shorter one a tap (grab)
InteractHoldFrames=12
; Loadout table swap: sets kept besides the Blueprint's, and the minimum spacing of two loadout changes (simulation frames)
MaxRetainedTableRevisions=4
MinFramesBetweenLoadoutChanges=30
