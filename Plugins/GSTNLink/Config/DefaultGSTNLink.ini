; Defaults of the GSTN Link plugin. A project overrides any of them in its own Config/DefaultGSTNLink.ini
; (or through Project Settings > Plugins > GSTN Link).

[/Script/GSTNLinkCore.GSTN_LinkSettings]
; Frames a predicted link waits for its response before the link tick clears it (m6 spec 7.1)
RequestTimeoutFrames=12
; Frames after a formation during which the watchdog does not call a one-sided link an orphan (m6 spec 7.6)
OrphanGraceFrames=3
; Priority tier of the link commands, contributed to the GSTN Input settings: above the combat roots (attack 100 ... combo 350), below Super (400)
CommandTiers=(((TagName="Command.Link"),360))
; Kit throws (M11 K2, owner decisions 2-3 of 2026-11-11). Applied when a kit asset that binds Command.Link.Grab is compiled: no kit is edited.
; ThrowInputMode: Stick = in a grab the stick picks the throw (forward/back = stick into that sector, up = Jump, down = Crouch; Attack = pummel);
; StickPlusSpecial = Special + stick forward/back, Special alone = up, Special + Crouch held = down; Buttons = the F12 shapes of the slot set.
; Notation (grab-link, owner 2026-11-23): the stick stays free to WALK and jump while holding; Attack neutral = N., Attack + tilt = F.,
; Attack + Crouch held = Cr., Attack + Crouch + tilt = Cr.F., no pummel (owner). The harness scenarios kit_throw_stick_* need Stick.
ThrowInputMode=Notation
; Notation only: Instant = F. throw in every direction (the throw's start aim snaps to the stick); BackThrow = F. forward only plus a B. throw
GrabTurnErgonomics=Instant
; The dodge press sets the grabbed partner down without a throw (owner: "credo", TO CONFIRM)
bPutDownWithDodge=True
; Grab spin (owner 2026-11-25): a 360 stick rotation while holding swings the partner round (Command.Link.Spin.*); cvar gstn.Grab.Spin
bGrabSpin=True
; Hold by the neck: the grabbed's neck_01 (reference pose) on this point of the grabber's root space (cm). TEST VALUES until the grab idle pose
HoldPose=(bHoldByNeck=True,HoldPointCm=(X=60.0,Y=15.0,Z=55.0),ExtraOffsetCm=(X=0.0,Y=0.0,Z=0.0))
NeckSocketName=neck_01
; Walk and jump while holding (GE_GrabHold on the grabber role). TEST VALUES; cvars gstn.Grab.WalkScale / gstn.Grab.JumpScale
HoldWalkScale=0.75
HoldJumpScale=0.7
bApplyKitThrows=True
; Special + Crouch held also grabs while a grab target is framed (beside the tap of the grab button)
bGrabWithSpecialCrouch=True
; The common set: a grabbing kit whose binding table and link extension name no throw for a direction gets this one. PLACEHOLDERS, no montage
FallbackThrows=(Forward="/Script/GSTNLinkNP.GSTN_GA_LinkThrowForward",Back="/Script/GSTNLinkNP.GSTN_GA_LinkThrowBack",Up="/Script/GSTNLinkNP.GSTN_GA_LinkThrowUp",Down="/Script/GSTNLinkNP.GSTN_GA_LinkThrowDown",Neutral="/Script/GSTNLinkNP.GSTN_GA_LinkThrowNeutral",CrouchForward="/Script/GSTNLinkNP.GSTN_GA_LinkThrowCrouchForward",SpinClockwise="/Script/GSTNLinkNP.GSTN_GA_LinkGrabSpinClockwise",SpinCounterClockwise="/Script/GSTNLinkNP.GSTN_GA_LinkGrabSpinCounterClockwise")
; ThrowSlotOverrides: designer slots (logical Combat.Button.* buttons) that replace a mode's shape per command; empty = the mode's shapes
