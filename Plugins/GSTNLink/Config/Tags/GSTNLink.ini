; Designer vocabulary of the GSTN Link plugin. Ini only: code never names these leaves, so a game adds its own cues in its own
; Config/Tags ini. The native tags (Combat.Link.*, Command.Link.*...) are declared in GSTN_LinkTags.h.
; Sync states and snapshots store indices and flags, never these tags.

[/Script/GameplayTags.GameplayTagsList]
GameplayTagList=(Tag="GameplayCue.Combat.Link.Formed",DevComment="Cue tag a presentation set plays when a link forms, such as a grab connecting")
GameplayTagList=(Tag="GameplayCue.Combat.Link.Broken",DevComment="Cue tag a presentation set plays when a link breaks, whatever the reason")
GameplayTagList=(Tag="GameplayCue.Combat.Link.Escape",DevComment="Cue tag a presentation set plays when the grabbed entity mashes free")
GameplayTagList=(Tag="GameplayCue.Combat.Pummel",DevComment="Cue tag a presentation set plays for a pummel hit on the linked partner")
GameplayTagList=(Tag="GameplayCue.Combat.Throw",DevComment="Cue tag a presentation set plays when a throw releases the partner")
