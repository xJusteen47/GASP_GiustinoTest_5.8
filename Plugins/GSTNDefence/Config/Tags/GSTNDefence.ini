; Designer vocabulary of the GSTN Defence plugin. Ini only: code never names these leaves, so a game adds its own cues in its own
; Config/Tags ini. The native tags (Combat.State.Shielding, Command.Defence.Shield...) are declared in GSTN_DefenceTags.h.
; Sync states and snapshots store indices and flags, never these tags.

[/Script/GameplayTags.GameplayTagsList]
GameplayTagList=(Tag="GameplayCue.Combat.Shield.Raise",DevComment="Cue tag a presentation set plays when the shield bubble is raised")
GameplayTagList=(Tag="GameplayCue.Combat.Shield.Hit",DevComment="Cue tag a presentation set plays for a hit absorbed by the shield bubble")
GameplayTagList=(Tag="GameplayCue.Combat.Shield.Break",DevComment="Cue tag a presentation set plays when the shield breaks")
GameplayTagList=(Tag="GameplayCue.Combat.Parry",DevComment="Cue tag a presentation set plays for a parry, whichever source (shield or move) produced it")
GameplayTagList=(Tag="GameplayCue.Combat.Tech",DevComment="Cue tag a presentation set plays when a tech succeeds")
