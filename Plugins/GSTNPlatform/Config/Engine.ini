; Collision channel of the platform shapes (many-enemies-replication.md 4.3, traversal-surfaces.md 4.1).
; A plugin config file named after an engine branch (Engine.ini, not DefaultEngine.ini: the engine's plugin modification layer
; is {PLUGIN}/Config/{TYPE}.ini, ConfigHierarchy.h GPluginModificationLayers) is merged into that branch when the plugin is
; mounted, so a project that enables the plugin gets the channel without editing its own DefaultEngine.ini
; (modularity-and-tags 3.7 rule 1). Checked by GSTNPlatform.Runtime.ChannelResolvedByName.
; The slot is GameTraceChannel4 because the sample project uses 1-3. If a project already uses this slot, move the line to the
; project's DefaultEngine.ini on a free slot with the same Name: the code finds the channel by name
; (UGSTN_PlatformSettings::PlatformObjectChannelName), never by slot.
; Default response Block: every existing profile (the Pawn capsule among them) blocks the shapes unless it says otherwise; the
; shapes' own responses are set in code from their behaviour.
[/Script/Engine.CollisionProfile]
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel4,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="GSTN_EnemyPlatform")
