; Defaults of the GSTN Combat GAS plugin. A project overrides any of them in its own Config/DefaultGSTNCombatGAS.ini
; (or through Project Settings > Plugins > GSTN Combat GAS).

[/Script/GSTNCombatGAS.GSTN_CombatGASSettings]
; Starting values of the combat attribute sets, by attribute property name. A kit init effect overwrites them with the kit's
; stats; they keep a pawn without a kit able to move. A meter maximum comes before its meter.
+AttributeDefaults=(Attribute="WalkSpeed",Value=600.0)
+AttributeDefaults=(Attribute="Acceleration",Value=2048.0)
+AttributeDefaults=(Attribute="Braking",Value=2048.0)
+AttributeDefaults=(Attribute="GroundFriction",Value=8.0)
+AttributeDefaults=(Attribute="AirControl",Value=0.85)
+AttributeDefaults=(Attribute="Weight",Value=100.0)
+AttributeDefaults=(Attribute="MaxCarryWeight",Value=0.0)
; Jump: owner's hold-gravity model, a facsimile of the early 2D Mario jumps (2026-11-18, docs/notes/handovers/jump-hold-gravity.md).
; SMB1 numbers scaled by big Mario 32 px = 180 cm: impulse 4 px/f, hold gravity 0.125 px/f2, release/fall gravity ~0.44 px/f2, terminal 4.5 px/f.
; Full jump ~344 cm (1.9 heights) in 30 frames, tap ~107 cm. The Mario 3D World values before (1240 / 0 / 4.1 / 4.1 / 6.0 / 2 / 11) are the
; CutUntilApex option of the jump ability (GravityModel). Kits hold absolute values: Tools/GAS/setup_test_kit_archetypes.py, setup_qa_movement_1117.py
+AttributeDefaults=(Attribute="JumpVelocity",Value=1350.0)
+AttributeDefaults=(Attribute="JumpRiseGravityScale",Value=2.6)
+AttributeDefaults=(Attribute="JumpCutGravityScale",Value=9.0)
+AttributeDefaults=(Attribute="FallGravityScale",Value=9.0)
