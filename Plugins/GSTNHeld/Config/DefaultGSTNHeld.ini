; GSTNHeld defaults (M10). Every value is a TEST VALUE, subject to playtesting: change them here, no code or Blueprint to touch.
[/Script/GSTNHeldCore.GSTN_HeldSettings]
; The holder drops what it holds when it has any of these tags (projected by the combat tick, the defence and the link plugins): hit, launched, grabbed
DefaultBreakRules=(DropWhenHolderHasAny=(GameplayTags=((TagName="Combat.State.Hitstun"),(TagName="Combat.State.Tumble"),(TagName="Combat.Link.Role.Grabbed"))),DropOnHolderEvents=(GameplayTags=((TagName="Combat.Event.KO"))),DropForwardCm=60.0)
; Strong button with an object in hand: a press shorter than this many frames is a tap (throw along the left stick); held longer it aims (reticle on,
; throw along the camera on release). With the reticle toggled on, a tap aims with the camera too
ThrowInput=(AimHoldFrames=12,MaxAimFrames=300,bCameraAimWhenReticleOn=True)
; The kits that get the pickup/drop/throw bindings when compiled (loadout extension, no Blueprint edited); a kit that binds a held command
; itself keeps its own. TEST VALUES: the test hub's default kit and the link test kit. bAddDefaultBindingsToEveryKit=True gives them to every kit
+KitsWithDefaultBindings=/Game/GASNPPTest/Combat/KIT_Test_Hits.KIT_Test_Hits
+KitsWithDefaultBindings=/Game/GASNPPTest/Combat/KIT_Test_Link.KIT_Test_Link
bAddDefaultBindingsToEveryKit=False
; Priority tier of the held commands (as Command.Link = 360): above the strong attacks (200), so RT with an object in hand throws
CommandTiers=(((TagName="Command.Held"),360))
