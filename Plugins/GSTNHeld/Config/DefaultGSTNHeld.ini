; GSTNHeld defaults (M10). Every value is a TEST VALUE, subject to playtesting: change them here, no code or Blueprint to touch.
[/Script/GSTNHeldCore.GSTN_HeldSettings]
; The holder drops what it holds when it has any of these tags (projected by the combat tick, the defence and the link plugins): hit, launched, grabbed
DefaultBreakRules=(DropWhenHolderHasAny=(GameplayTags=((TagName="Combat.State.Hitstun"),(TagName="Combat.State.Tumble"),(TagName="Combat.Link.Role.Grabbed"))),DropOnHolderEvents=(GameplayTags=((TagName="Combat.Event.KO"))),DropForwardCm=60.0)
; Strong button with an object in hand: a press shorter than this many frames is a tap (throw along the left stick); held longer it aims (reticle on,
; throw along the camera on release). With the reticle toggled on, a tap aims with the camera too
; Slice 8 (M10 G7 shoulder aim, TEST VALUES): AimView Shoulder or KeepView; the request tag is what GSTNCamera reads to go over the shoulder
ThrowInput=(AimHoldFrames=12,MaxAimFrames=300,bCameraAimWhenReticleOn=True,AimView=Shoulder,ShoulderAimPitchDeg=0.0,AimViewRequestTags=(GameplayTags=((TagName="Camera.Request.Aim"))))
; Throw wind-up (slice 10, owner's request 2026-11-11, TEST VALUES): frames from RT's release to the object leaving the hand, with a montage from the
; release (placeholder: the GASP forward shove montage, no throw animation exists yet). 0 = instant (the throw before slice 10). An object's definition can override it
; (bOverrideWindup); thrown enemies have their own (ThrownEnemies Windup). In PIE: gstn.Held.Windup 15 (objects and enemies), gstn.Held.Windup 0 = instant
DefaultThrowWindup=(ReleaseFrames=0,Montage="/Game/Characters/UEFN_Mannequin/Animations/Interactions/Shoves/AM_M_relaxed_ragdoll_shove_stand_F_A.AM_M_relaxed_ragdoll_shove_stand_F_A",MontagePlayRate=1.0,MontageRootMotionScale=0.0)
; The kits that get the pickup/drop/throw bindings when compiled (loadout extension, no Blueprint edited); a kit that binds a held command
; itself keeps its own. TEST VALUES: the test hub's default kit and the link test kit. bAddDefaultBindingsToEveryKit=True gives them to every kit
+KitsWithDefaultBindings=/Game/GASNPPTest/Combat/KIT_Test_Hits.KIT_Test_Hits
+KitsWithDefaultBindings=/Game/GASNPPTest/Combat/KIT_Test_Link.KIT_Test_Link
bAddDefaultBindingsToEveryKit=False
; Priority tier of the held commands (as Command.Link = 360): above the strong attacks (200), so RT with an object in hand throws
CommandTiers=(((TagName="Command.Held"),360))
; Pickup target (owner's call, both kept for playtesting): True = the object the interact probe frames, False = simply the nearest in reach.
; When the framed object is taken first (contested) or gone: True = the nearest other free object, False = the hand closes on nothing
bPickupTakesFocusedObject=True
bFocusMissFallsBackToNearest=True
; Size classes (M10 G6, at most four). The carry load slows walk and jump by the object's weight over the holder's capacity (MaxCarryWeight, or
; DefaultCarryCapacityKg when the attribute is 0) times the class's loss at full load; Bans remove commands while carrying (OnlyBindingsRequiring =
; only the bindings of that context, the air attacks). TEST VALUES: the owner decides the slowdown, the throw strength and which objects are liftable
DefaultCarryCapacityKg=50.0
; Thrown enemies (M10 G9, owner design 2026-11-11, TEST VALUES): a grabbed enemy the grabber can lift is thrown with the held throw (RT tap = stick,
; RT held = camera); one it cannot keeps the grab kit throws. LiftRule: WeightVsCapacity (enemy Weight attribute, else DefaultEnemyWeight, against
; the grabber's MaxCarryWeight, else DefaultEnemyCarryCapacity; fighter weight units, 100 = standard) or AnyGrabbed; the tag Combat.Held.NoLift forbids it in both. The hitbox (Throw) keeps the code defaults: 12 m/s, 45 cm, 14 damage, 3 hits.
ThrownEnemies=(bEnabled=True,LiftRule=WeightVsCapacity,DefaultEnemyWeight=100.0,DefaultEnemyCarryCapacity=100.0,LiftableLinkTypes=(GameplayTags=((TagName="Combat.Link.Type.Grab"))),FullLoadSpeedScale=0.75,RegrabLockFrames=60,Windup=(ReleaseFrames=0,Montage="/Game/Characters/UEFN_Mannequin/Animations/Interactions/Shoves/AM_M_relaxed_ragdoll_shove_stand_F_A.AM_M_relaxed_ragdoll_shove_stand_F_A",MontagePlayRate=1.0,MontageRootMotionScale=0.0))
+SizeClasses=(SizeTag=(TagName="Combat.Held.Size.Light"),CarryingTag=(TagName="Combat.Held.Carrying.Light"),SpeedLossAtFullLoad=0.1,JumpLossAtFullLoad=0.1,bRequiresCapacity=False,ThrowSpeedScale=1.0)
+SizeClasses=(SizeTag=(TagName="Combat.Held.Size.Medium"),CarryingTag=(TagName="Combat.Held.Carrying.Medium"),SpeedLossAtFullLoad=0.3,JumpLossAtFullLoad=0.3,bRequiresCapacity=False,ThrowSpeedScale=0.85,Bans=((Commands=(GameplayTags=((TagName="Command.Defence.Shield")))),(Commands=(GameplayTags=((TagName="Command.Attack"),(TagName="Command.Strong"),(TagName="Command.Special"),(TagName="Command.Combo"),(TagName="Command.Super"))),OnlyBindingsRequiring=(TagName="Input.Context.Airborne"))))
+SizeClasses=(SizeTag=(TagName="Combat.Held.Size.Heavy"),CarryingTag=(TagName="Combat.Held.Carrying.Heavy"),SpeedLossAtFullLoad=0.5,JumpLossAtFullLoad=1.0,bRequiresCapacity=False,ThrowSpeedScale=0.7,Bans=((Commands=(GameplayTags=((TagName="Command.Attack"),(TagName="Command.Strong"),(TagName="Command.Special"),(TagName="Command.Combo"),(TagName="Command.Super"),(TagName="Command.Buff"),(TagName="Command.Defence"),(TagName="Command.Movement.Jump"),(TagName="Command.Movement.Dash"),(TagName="Command.Dash"),(TagName="Command.Interact.Grab"))))))
+SizeClasses=(SizeTag=(TagName="Combat.Held.Size.Huge"),CarryingTag=(TagName="Combat.Held.Carrying.Huge"),SpeedLossAtFullLoad=0.7,JumpLossAtFullLoad=1.0,bRequiresCapacity=True,ThrowSpeedScale=0.5,Bans=((Commands=(GameplayTags=((TagName="Command.Attack"),(TagName="Command.Strong"),(TagName="Command.Special"),(TagName="Command.Combo"),(TagName="Command.Super"),(TagName="Command.Buff"),(TagName="Command.Defence"),(TagName="Command.Movement.Jump"),(TagName="Command.Movement.Dash"),(TagName="Command.Dash"),(TagName="Command.Interact.Grab"))))))
