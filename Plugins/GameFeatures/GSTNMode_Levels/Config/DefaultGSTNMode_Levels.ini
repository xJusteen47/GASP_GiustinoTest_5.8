; GSTNMode_Levels defaults (M12 G6). The real values are in the level's GameRules asset (piece "Levels mode"); these are the values without one.
; TEST VALUES: every number below is a first guess to be tuned by playing (owner rule: values are data).
[/Script/GSTNMode_LevelsRuntime.GSTN_LevelsRules]
bEnabled=False
; GM.2: one to four players, also alone
MinPlayers=1
MaxPlayers=4
; GM.13: friendly fire ON in Levels (data)
bFriendlyFire=True
; GM.5: one alive player in the goal starts the grace timer, the level ends when it runs out
GoalGraceSeconds=10
bGoalFinishEarlyWhenAllInside=True
bGoalCancelWhenNobodyInside=False
ResultsSeconds=10
bSeamlessTravel=True
PollHz=4
; Who is down (not alive for the goal) and who is back; tags only, the same ones the missions use
DownEvents=(GameplayTags=((TagName="Combat.Event.KO")))
UpEvents=(GameplayTags=((TagName="Message.Respawn.Respawned")))
; The respawn framework's level restart: the missions reset and collectibles come back (same event as the missions' ResetOnEvents), so the
; level's tally restarts (counters marked bResetOnLevelRestart=false, like deaths, and the clock do not). A restart from a checkpoint keeps both
RestartEvents=(GameplayTags=((TagName="Message.Respawn.RestartLevel")))
