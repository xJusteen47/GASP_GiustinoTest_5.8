; Designer vocabulary of the GSTN Parts plugin (combat-parts.md 7). Ini only: code never names a leaf, so a game adds its own
; leaves in its own Config/Tags ini. The native tags (Combat.Part.*, Combat.Event.Part.*...) are declared in GSTN_PartsTags.h.
; Sync states and snapshots store part indices and masks, never these tags.

