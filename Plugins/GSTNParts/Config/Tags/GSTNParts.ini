; Designer vocabulary of the GSTN Parts plugin. The state, event and message tags are declared natively in GSTNPartsCore
; (GSTN_PartsTags.h); these leaves are data and code never names one. A game adds its own leaves in its project tag ini. One plain
; GameplayTagList= line per tag, as in the project tag inis: a loose tag ini does not read the +GameplayTagList= form.
; GSTNPartsCore registers this folder at startup.

[/Script/GameplayTags.GameplayTagsList]
GameplayTagList=(Tag="Part.Type.Head",DevComment="Classification of a part: the head. Unrelated to Combat.Hurtbox.*, which classifies hurtboxes")
GameplayTagList=(Tag="Part.Type.Torso",DevComment="Classification of a part: the torso")
GameplayTagList=(Tag="Part.Type.Arm",DevComment="Classification of a part: an arm")
GameplayTagList=(Tag="Part.Type.Leg",DevComment="Classification of a part: a leg")
GameplayTagList=(Tag="Part.Type.Weapon",DevComment="Classification of a part: a held or mounted weapon")
GameplayTagList=(Tag="Part.Type.Armour",DevComment="Classification of a part: an armour plate")
GameplayTagList=(Tag="Part.Type.Crystal",DevComment="Classification of a part: an exposed crystal")
GameplayTagList=(Tag="GameplayCue.Combat.Part.Hit",DevComment="Cue played when a hit damages a part")
GameplayTagList=(Tag="GameplayCue.Combat.Part.Break",DevComment="Cue played when a part breaks")
GameplayTagList=(Tag="GameplayCue.Combat.Part.Ricochet",DevComment="Cue played when a hit bounces off a part (a ricochet band of the penetration table)")
GameplayTagList=(Tag="GameplayCue.Combat.Part.Shatter",DevComment="Cue played when an entity shatters (all its breakable parts gone or its main health gone)")
