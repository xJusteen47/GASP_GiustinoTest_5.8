; Defaults of the GSTN Parts plugin. A project overrides any of them in its own Config/DefaultGSTNParts.ini
; (or through Project Settings > Plugins > GSTN Parts).

[/Script/GSTNPartsCore.GSTN_PartsSettings]
; Weight scale at the damage cap of a part set with no weight curve of its own (1.0 at no damage, linear in between)
DefaultWeightScaleAtCap=0.6
; Effective weight never goes below this fraction of the base weight
MinWeightScale=0.35
; Host-tier ceilings of the cosmetic debris (combat-parts.md 6.4); proposals to be measured
PresentationBudget=(MaxChunks=48,ChunkLifetime=4.0,MaxShardParticles=600,MaxGeometryCollections=2,SleepAfter=1.5)
