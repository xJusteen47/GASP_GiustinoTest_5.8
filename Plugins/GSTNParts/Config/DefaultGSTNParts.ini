; Defaults of the GSTN Parts plugin. A project overrides any of them in its own Config/DefaultGSTNParts.ini
; (or through Project Settings > Plugins > GSTN Parts). Simulation-read content (the penetration table, the weight curve) must be
; identical on every machine of a match, like any other setting the simulation reads.

[/Script/GSTNPartsCore.GSTN_PartsSettings]
; Empty = the plugin ships no default asset yet (the penetration table arrives with the part data, the weight curve with the math)
DefaultPenetrationTable=
DefaultWeightCurve=
; Presentation budgets, host-tier ceilings (combat-parts 6.4): scaled down by scalability and host frame time, never up
PresentationBudget=(MaxChunks=48,ChunkLifetimeSeconds=4.0,MaxShardParticles=600,MaxGeometryCollections=2,SleepStopSeconds=1.5)
