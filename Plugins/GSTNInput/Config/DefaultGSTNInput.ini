; Defaults of the GSTN Input plugin. A project overrides any of them in its own Config/DefaultGSTNInput.ini
; (or through Project Settings > Plugins > GSTN Input). The same values as the class defaults, written out so a project can
; see them. CommandTiers and ExclusiveButtons are empty on purpose: the game, or a plugin such as GSTN Combat, lists its own.

[/Script/GSTNInputCore.GSTN_InputSettings]
DefaultBufferFrames=8
bHoldBufferByDefault=True
MaxHoldBufferFrames=0
DefaultSimultaneityFrames=3
SimultaneousFrames=2
BufferConflictPolicy=MostRecent
bChordGraceByDefault=False
ChordGraceFrames=3
StickDeadZone=0.200000
AimZone=0.500000
FlickFrames=3
DiagonalHalfAngle=22.500000
WorldReferenceYaw=0.000000
; A context is grounded or airborne, never both: binding validation relies on it to tell such bindings apart.
+ExclusiveContextGroups=(Tags=(GameplayTags=((TagName="Input.Context.Grounded"),(TagName="Input.Context.Airborne"))))

[CoreRedirects]
; The Mover sim-state tracker used to sit in the host game's module and then in the combat plugin, before it moved here.
+ClassRedirects=(OldName="/Script/GASP_Giustino2.GSTN_MoverSimStateTracker",NewName="/Script/GSTNInputNP.GSTN_MoverSimStateTracker")
+ClassRedirects=(OldName="/Script/GSTNCombatNP.GSTN_MoverSimStateTracker",NewName="/Script/GSTNInputNP.GSTN_MoverSimStateTracker")
